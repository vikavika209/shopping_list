spring.application.name=shopping_list

spring.profiles.active=local

spring.docker.compose.enabled=false

spring.liquibase.enabled=false

spring.datasource.url=jdbc:h2:mem:shopping_list;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

rates.api.base=USD
rates.api.url=https://api.frankfurter.dev/v1

security.jwt.secret=replace-with-a-256-bit-random-secret-32+chars
security.jwt.secret.expiration-minutes=15
security.jwt.secret.refresh-expiration-days=7
